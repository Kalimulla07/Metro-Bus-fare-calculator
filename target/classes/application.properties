# ========================================================
# Metro & Bus Fare Calculator Application Configuration
# ========================================================

# Server Port (Default: 8080)
server.port=8080

# Application Name
spring.application.name=metro-bus-fare-calculator

# MySQL Database Configuration
# NOTE: Update the username and password below to match your local MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/transit_fare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Kalim@0147
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static resource handling for frontend
spring.web.resources.static-locations=classpath:/static/
