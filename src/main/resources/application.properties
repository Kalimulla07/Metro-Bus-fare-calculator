# ========================================================
# Metro & Bus Fare Calculator Application Configuration
# ========================================================

# Server Port (Supports cloud environments like Render/Railway automatically)
server.port=${PORT:8080}

spring.application.name=metro-bus-fare-calculator

# MySQL Database Configuration
# Works automatically on Railway, Render, or local PC
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:transit_fare_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Kalim@0147}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static resource handling for frontend
spring.web.resources.static-locations=classpath:/static/
